# ─────────────────────────────────────────────────────────────
# Site configuration.
# Published from this repo's docs/ folder to https://lenaliebich.github.io
# ─────────────────────────────────────────────────────────────
project:
  type: website
  output-dir: docs          # GitHub Pages serves from main branch /docs
  resources:
    - ".nojekyll"          # stops GitHub Pages running Jekyll over Quarto output
    - "assets/fonts/OFL-*.txt"   # the font license travels with the published fonts
  render:
    - "*.qmd"

website:
  title: "Lena Liebich"
  description: "Postdoctoral Fellow at the Harvard Business School AI Institute"
  site-url: "https://lenaliebich.github.io"
  # Preview card shown when a page is shared on LinkedIn, X, Slack, etc.
  # Quarto turns this into an absolute URL using site-url above.
  image: assets/img/profile.jpg
  open-graph: true
  twitter-card: true

  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: "mailto:lliebich@hbs.edu"
        aria-label: Email
      # target/rel here rather than from the filter: the navbar is built by
      # Quarto's template, so its links never reach a Pandoc filter.
      - icon: google
        href: "https://scholar.google.com/citations?user=cl_MymMAAAAJ"
        aria-label: Google Scholar
        target: _blank
        rel: "noopener noreferrer"
      - icon: linkedin
        href: "https://www.linkedin.com/in/lena-liebich"
        aria-label: LinkedIn
        target: _blank
        rel: "noopener noreferrer"

  page-footer:
    border: false
    left: "© 2026 Lena Liebich"
    right: 'Built with <a href="https://quarto.org" target="_blank" rel="noopener noreferrer">Quarto</a>'

format:
  html:
    theme: [cosmo, assets/styles.scss]
    # Self-hosted IBM Plex Sans and Spectral; see the header of that file
    css: assets/fonts/fonts.css
    toc: false
    anchor-sections: false
    smooth-scroll: true
    # One canonical address per page. Quarto's navigation rewrites
    # /index.html to /, so without this a visit to the same page could arrive
    # under either path and GoatCounter (below) would count them separately.
    # Also tells search engines which address to list.
    canonical-url: true
    include-in-header:
      # Visitor statistics: GoatCounter, account lenaliebich
      # (https://lenaliebich.goatcounter.com). Cookieless, stores only
      # aggregate counts, EU-hosted; see goatcounter.com/help/privacy.
      #
      # Pinned to count.v5.js with its integrity hash, so the browser refuses
      # to run the script if the file is ever changed. The hash was checked
      # against the served file, not just copied. To upgrade, take the new
      # version's tag from goatcounter.com/help/countjs-versions.
      #
      # Visits from localhost (quarto preview, tools/make-cv-pdf.py) are
      # ignored by count.js itself, so local work is never counted.
      text: |
        <script data-goatcounter="https://lenaliebich.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" crossorigin="anonymous" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>

# Opens links that leave the current page in a new tab. See the file for what
# counts as "leaving" and why this is not done in the browser.
filters:
  - tools/external-links.lua

# No `bibliography:` key: publications are written out by hand in
# _publications.qmd rather than generated from BibTeX. To switch to citations,
# add a .bib file and point `bibliography:` at it here.

execute:
  freeze: auto
